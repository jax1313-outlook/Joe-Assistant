[pytest]
# The three suites in this repository. Named explicitly rather than letting
# collection walk the tree, because Play-Pen/ and ASST/ hold archived copies
# whose tests are history -- collecting them would report failures about
# decisions that were superseded months ago.
testpaths =
    Assistant_Plugin/tests
    Workers/tests
    Governance/tests
    Testing
python_files = test_*.py
addopts = -q
